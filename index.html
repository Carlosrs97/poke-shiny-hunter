<script type="application/ld+json">{"@context":"https://schema.org","@type":"VideoGame","name":"Poke Shiny Hunter","description":"Free fan-made egg hatching and shiny hunting browser game.","applicationCategory":"Game","operatingSystem":"Any","inLanguage":["es","en","pt","fr","de","it"],"isAccessibleForFree":true,"author":{"@type":"Person","name":"Carlos Rojas","alternateName":"Capi97"}}</script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2233;--pan:#f4f1e8;--bl:#2f6fd6;--ac:#e8503a;--mu:#5d667a;--b1:#303a5b;--b2:#2a3350;
--cut:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}
*{box-sizing:border-box;image-rendering:pixelated}
body{margin:0;background:var(--b2) repeating-conic-gradient(var(--b1) 0 25%,var(--b2) 0 50%) 0 0/24px 24px;transition:background-color .6s;color:var(--ink);font:10px/1.7 "Press Start 2P","Courier New",monospace}
main{max-width:780px;margin:0 auto;padding:10px}
h1{color:#fff;font-size:14px;margin:6px 0 10px;text-shadow:3px 3px 0 #000}
.box,.hud span,.slot,.card{background:var(--pan);border:4px solid var(--ink);clip-path:var(--cut)}
.box{padding:10px;margin:8px 0}
.hud{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.hud span,.hud button{padding:5px 8px;font-size:9px;display:flex;align-items:center;gap:5px}.hud img{height:18px}
button{font:inherit;font-size:9px;color:#fff;background:var(--bl);border:0;padding:9px 10px;cursor:pointer;clip-path:var(--cut);box-shadow:inset -3px -3px 0 #0004,inset 3px 3px 0 #fff4}
button:hover:not(:disabled){filter:brightness(1.15)}button:disabled{background:#8a8f9c!important;color:#d8dbe2;cursor:default}
button.g{background:#2f9e5b}button.r{background:var(--ac)}button.w{background:var(--pan);color:var(--ink);box-shadow:inset -3px -3px 0 #0003,inset 3px 3px 0 #fff}button.on{background:var(--ac)}button.lk{background:#5b6070}
nav{margin-bottom:8px}.nr{display:grid;gap:5px;margin-bottom:5px}nav button{padding:7px 2px;font-size:7px;display:flex;flex-direction:column;align-items:center;gap:3px}nav img{height:20px;width:auto;display:block}.nv0{background:var(--bl)}.nv1{background:#2f9e5b}.nv2{background:#c9822a}
#stage{position:relative;height:300px;border:4px solid var(--ink);overflow:hidden;background:#222 center/cover;clip-path:var(--cut)}
#amb{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#aura{position:absolute;left:50%;bottom:10px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,var(--a,#fff8) 0,transparent 65%);opacity:0;z-index:0}
#aura.on{animation:au .45s infinite alternate}@keyframes au{from{opacity:.3}to{opacity:1;transform:scale(1.15)}}
#shd{position:absolute;left:50%;bottom:16px;width:110px;height:12px;margin-left:-55px;background:#0006;border-radius:50%}
#egg{position:absolute;left:50%;bottom:22px;width:120px;margin-left:-60px;cursor:pointer;z-index:1;transform-origin:50% 90%}
#egg.shake{animation:wob .9s steps(1)}#egg.drop{animation:dp .5s steps(8)}
@keyframes wob{0%,100%{transform:rotate(0)}12%{transform:rotate(-14deg)}26%{transform:rotate(0)}40%{transform:rotate(14deg)}54%{transform:rotate(0)}68%{transform:rotate(-8deg)}82%{transform:rotate(8deg)}}
@keyframes sk{0%,100%{transform:rotate(0)}25%{transform:rotate(9deg) translateX(5px)}75%{transform:rotate(-9deg) translateX(-5px)}}
@keyframes dp{from{transform:translateY(-260px)}}
#mon,.xs img{position:absolute;image-rendering:pixelated}
#mon{left:50%;bottom:34px;transform:translateX(-50%);display:none;z-index:3;animation:rv .5s steps(6)}
@keyframes rv{from{transform:translateX(-50%) translateY(50px) scale(.2);opacity:0}}
.xs #xm{left:8%;bottom:10px;z-index:2}.xs #xw{right:8%;top:30px;z-index:2}
#msg{position:absolute;top:10px;left:0;right:0;text-align:center;color:#fff;text-shadow:2px 2px 0 #000;z-index:4;min-height:20px;font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}.lbl{color:var(--mu);font-size:8px}
.q{display:inline-block;padding:1px 5px;color:#fff;font-size:8px;text-shadow:1px 1px 0 #0006}.st{color:#d79a00;font-size:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.slot{padding:4px;text-align:center;cursor:pointer;border-color:var(--c);position:relative;font-size:7px;line-height:1.4}
.slot img{width:72px;height:72px}.slot.sel{background:#ffe48a;outline:4px solid var(--ac)}.slot .x{position:absolute;top:0;left:3px;color:#c0392b;font-size:8px}

nuevos en la Pokédex!","new in the Pokédex!"],["Registrar Pokédex","Register in Pokédex"],["por registrar:","to register:"],["Para capturar Pokémon en expediciones y en la guardería","To catch Pokémon on expeditions and at the nursery"],["Expediciones · Pokéball","Expeditions · Poké Ball"],["Espacio de la bolsa","Bag space"],["Cada consumible: hasta","Each consumable: up to"],["Solo Pokémon poco comunes o mejores","Uncommon Pokémon or better only"],["Solo Pokémon raros o mejores","Rare Pokémon or better only"],["Solo Épicos y Legendarios","Epic and Legendary only"],["Creado por","Created by"],["Autor:","Author:"],["Juego de fans, gratis y sin anuncios.","Fan game, free and ad-free."],["Esta web guarda tu progreso y tus preferencias en el almacenamiento local de tu navegador (similar a las cookies, pero solo para el juego). No usamos publicidad, seguimiento ni analítica.","This site saves your progress and preferences in your browser's local storage (similar to cookies, but only for the game). We use no advertising, tracking or analytics."],["(almacenamiento local). No usamos cookies de publicidad ni de seguimiento, ni analítica.","(local storage). We use no advertising or tracking cookies, and no analytics."],["Adivina el código de 4 colores en 10 intentos.","Guess the 4-color code in 10 tries."],["Apaga todo el hielo azul; cada toque cambia a sus vecinas.","Turn off all the blue ice; each tap flips its neighbors."],["Atrapa 15 bayas y esquiva las bombas negras (3 vidas).","Catch 15 berries and dodge the black bombs (3 lives)."],["Buscaminas: descubre todas las casillas sin tocar un Electrode.","Minesweeper: uncover every tile without touching an Electrode."],["Detén la barra en la zona naranja 4 veces seguidas.","Stop the bar in the orange zone 4 times in a row."],["Encuentra las 8 parejas con menos de 10 fallos.","Find all 8 pairs with fewer than 10 misses."],["Golpea a los Croagunk durante 25 s (12 puntos). ¡Muk resta!","Hit the Croagunk for 25 s (12 points). Muk subtracts!"],["Mantén pulsado para que la barra verde siga al Magikarp.","Hold down so the green bar follows the Magikarp."],["Ordena las fichas del 1 al 8.","Arrange the tiles from 1 to 8."],["Repite la secuencia de cristales (7 rondas).","Repeat the crystal sequence (7 rounds)."],["Cada Pokémon trae de 1 a 5 estrellas. Cuantas más tenga, más vale.","Each Pokémon has 1 to 5 stars. The more it has, the more it's worth."],["Cada zona tiene su propio minijuego. Mientras juegas no puedes cambiar de pestaña (usa Rendirse para salir).","Each zone has its own minigame. While playing you can't switch tabs (use Give up to leave)."],["Cambia un Pokémon por otro de valor parecido para completar tu Pokédex. Las ofertas se renuevan cada 15 minutos.","Swap a Pokémon for another of similar value to complete your Pokédex. Offers refresh every 15 minutes."],["Cambia un Pokémon por otro de valor parecido. De vez en cuando aparece un trueque especial con Pokémon de más de ₽1.000.","Swap a Pokémon for another of similar value. Now and then a special trade appears with Pokémon worth over ₽1,000."],["Completa logros para ganar ₽ y experiencia.","Complete goals to earn ₽ and experience."],["Compra huevos y objetos con ₽. Los consumibles duran un tiempo, y en la bolsa solo caben unos pocos de cada. Amplíala en «Ditto mejoras».","Buy eggs and items with ₽. Consumables last a while, and the bag only holds a few of each. Expand it in “Ditto upgrades”."],["Compra huevos y objetos. En «Ditto mejoras» amplías la velocidad y capacidad de tus huevos y del PC.","Buy eggs and items. In “Ditto upgrades” you improve the speed and capacity of your eggs and PC."],["Cuando un logro está listo aparece un aviso en la pestaña para reclamarlo.","When a goal is ready, a notice appears on the tab so you can claim it."],["Cuantos más Pokémon de la zona tengas registrados, más valiosos son los que te piden y mejor pagan.","The more of the zone's Pokémon you have registered, the more valuable the ones they ask for and the better they pay."],["Cuantos más Pokémon de la zona tengas, más valiosas son las ofertas. A veces aparece un trueque muy especial.","The more of the zone's Pokémon you have, the more valuable the offers. Sometimes a very special trade appears."],["Ditto pasea y deja huevos por el suelo. Tócalos para recogerlos y ábrelos en la pestaña Huevos.","Ditto wanders around and leaves eggs on the ground. Tap them to collect and open them in the Eggs tab."],["Tu Ditto pasea por la guardería y deja huevos por el suelo. Tócalos para recogerlos; luego los abrirás en la pestaña Huevos.","Your Ditto wanders the nursery and leaves eggs on the ground. Tap them to collect; you'll open them later in the Eggs tab."],["El PC tiene capacidad limitada. Amplíala en la Tienda cuando se llene.","The PC has limited capacity. Expand it in the Shop when it fills up."],["El huevo básico de Ditto: se recoge en la guardería y se abre en la pestaña Huevos","Ditto's basic egg: collected at the nursery and opened in the Eggs tab"],["Elige un Pokémon (cada uno solo puede ir una vez) y captura hasta 5 salvajes; el mejor siempre aparece el último. Si fallas pierdes las capturas (tu Pokémon vuelve, pero retirado); si te retiras lo conservas todo.","Pick a Pokémon (each can only go once) and capture up to 5 wild ones; the best always appears last. If you fail you lose the captures (your Pokémon returns, but retired); if you retreat you keep everything."],["Elige un Pokémon del PC (cada uno puede ir una sola vez) y explora la zona: irás encontrando salvajes.","Pick a Pokémon from the PC (each can go only once) and explore the zone: you'll meet wild ones."],["En «Ditto mejoras» aceleras los huevos de Ditto, amplías el PC y el almacén de la guardería.","In “Ditto upgrades” you speed up Ditto's eggs and expand the PC and the nursery storage."],["Entrega Pokémon (hasta 5 por encargo). Dan ₽, experiencia y Pokédrops. El encargo principal da una gran recompensa; los mundos nuevos se compran con ₽ al llegar al nivel necesario.","Deliver Pokémon (up to 5 per quest). They give ₽, experience and Pokédrops. The main quest gives a great reward; new worlds are bought with ₽ once you reach the required level."],["Incubadora: deja un huevo especial cada cierto tiempo · almacén de 5","Incubator: leaves a special egg every so often · storage of 5"],["Junta 3 Pokémon iguales y se fusionan en su evolución, que vale mucho más.","Gather 3 identical Pokémon and they merge into their evolution, which is worth much more."],["La Pokédex se divide por zonas. Cada Pokémon pertenece a una sola zona, y arriba verás qué te falta por cada rareza.","The Pokédex is divided by zones. Each Pokémon belongs to a single zone, and above you'll see what you're missing for each rarity."],["Lanza Pokéballs para capturar hasta 5. Cada lanzamiento es una oportunidad; mejores bolas, mejores opciones. La bola se agita… y suena un «click» si lo consigues.","Throw Poké Balls to capture up to 5. Every throw is a chance; better balls, better odds. The ball shakes… and a “click” sounds if you succeed."],["Los Pokédrops se abren solos al conseguirlos: toca la bola 4 veces. Cada toque puede despertar su poder; si se transforma, vuelven a contar los toques.","Pokédrops open by themselves when you get them: tap the ball 4 times. Each tap may awaken its power; if it transforms, the taps start counting again."],["Los cascarones se rompen sin ceremonias · 15 min","Shells break without ceremony · 15 min"],["Los cascarones se rompen sin ceremonias · 5 min","Shells break without ceremony · 5 min"],["Los cascarones se rompen sin ceremonias · 60 min","Shells break without ceremony · 60 min"],["Los huevos comunes brotan sin fin · 15 min","Common eggs sprout endlessly · 15 min"],["Los huevos comunes brotan sin fin · 5 min","Common eggs sprout endlessly · 5 min"],["Los huevos comunes brotan sin fin · 60 min","Common eggs sprout endlessly · 60 min"],["Un aroma místico atrae a lo brillante · 15 min","A mystic aroma attracts the shiny · 15 min"],["Un aroma místico atrae a lo brillante · 5 min","A mystic aroma attracts the shiny · 5 min"],["Un aroma místico atrae a lo brillante · 60 min","A mystic aroma attracts the shiny · 60 min"],["Los encargos piden Pokémon concretos de la zona. Entrégalos y cobra ₽, experiencia y Pokédrops.","Quests ask for specific Pokémon of the zone. Deliver them and earn ₽, experience and Pokédrops."],["Los objetos de tu Mochila ayudan en la caza. Descubre qué hace cada uno.","The items in your Bag help the hunt. Discover what each one does."],["Mejora a Ditto y el almacén de huevos en Tienda › Ditto mejoras.","Upgrade Ditto and the egg storage in Shop › Ditto upgrades."],["Mejora definitiva: los huevos más codiciados","Ultimate upgrade: the most coveted eggs"],["Mejora: sus huevos esconden joyas más valiosas","Upgrade: its eggs hide more valuable gems"],["Pasivo: a veces ves el punto débil del Pokémon y tu captura es crítica","Passive: sometimes you spot the Pokémon's weak point and your capture is critical"],["Pasivo: a veces, la bola que falla vuelve a tu mano","Passive: sometimes a failed ball returns to your hand"],["Pasivo: cada 10 huevos favorece Pokémon que no tienes","Passive: every 10 eggs favors Pokémon you don't have"],["Pasivo: duplica el stock de huevos de la tienda","Passive: doubles the shop's egg stock"],["Pasivo: el aroma del Incienso, para siempre. Lo brillante te encuentra","Passive: the aroma of Incense, forever. The shiny finds you"],["Pasivo: el poder del Calcio, para siempre. Los cascarones se rompen solos","Passive: the power of Calcium, forever. Shells break by themselves"],["Pasivo: gestiona el PC por zona, muestra tu patrimonio shiny y revela las probabilidades ocultas","Passive: manages the PC by zone, shows your shiny net worth and reveals the hidden odds"],["Pasivo: mejores estrellas en los huevos","Passive: better stars from eggs"],["Pasivo: su aroma atrae a los Pokémon salvajes hacia la guardería","Passive: its aroma draws wild Pokémon to the nursery"],["Permite evolucionar a 1 shiny (pestaña Shiny)","Lets you evolve 1 shiny (Shiny tab)"],["Para evolucionar un shiny necesitas una Piedra brillante (se consigue con Pokédrops).","To evolve a shiny you need a Shiny Stone (obtained from Pokédrops)."],["Se consiguen en encargos y Pokéjuegos. Se abren solos al conseguirlos: toca la bola 4 veces; cada toque puede despertar su poder y mejorarla (Pokéball → Superball → Ultraball → Masterball) y reinicia los toques","Obtained from quests and Poké Games. They open by themselves: tap the ball 4 times; each tap may awaken its power and upgrade it (Poké Ball → Great Ball → Ultra Ball → Master Ball) and restarts the taps"],["Si ganas recibes 1 Pokédrop. Cada zona tiene una espera de 15 minutos para volver a ganarlo.","If you win you get 1 Pokédrop. Each zone has a 15-minute wait before you can earn it again."],["Un minijuego distinto por zona, jugable sin límite. Si ganas, recibes 1 Pokédrop (cada zona tiene su propio cooldown de 15 min para la recompensa).","A different minigame per zone, playable without limit. If you win you get 1 Pokédrop (each zone has its own 15-minute cooldown for the reward)."],["Si te retiras te quedas con todo. Si fallas pierdes las capturas y tu Pokémon vuelve retirado. El último rival es el mejor… y a veces es algo más que un simple Pokémon.","If you retreat you keep everything. If you fail you lose the captures and your Pokémon returns retired. The last rival is the best… and sometimes it is more than a mere Pokémon."],["Si tienes su shiny, la ficha muestra el sprite brillante. En la pestaña «Objetos» quedan anotados todos los objetos que consigues.","If you own its shiny, the card shows the shiny sprite. The “Items” tab records every item you obtain."],["Si una especie tiene varias evoluciones posibles (como Eevee), una ruleta elige una al azar.","If a species has several possible evolutions (like Eevee), a roulette picks one at random."],["Tus shinies no se pueden vender ni llevar de expedición. Para evolucionarlos hace falta una Piedra brillante.","Your shinies can't be sold or taken on expeditions. Evolving them needs a Shiny Stone."],["Toca el huevo grande para abrir uno de los que has recogido en la Guardería: de dentro sale un Pokémon de la zona.","Tap the big egg to open one you collected at the Nursery: a Pokémon of the zone comes out."],["Toca el huevo para abrirlo. Los huevos comunes se generan solos (mejoras en la Tienda › Ditto). Con suerte saldrá un shiny: va a su caja y es tuyo para siempre.","Tap the egg to open it. Common eggs generate by themselves (upgrades in Shop › Ditto). With luck a shiny comes out: it goes to its box and is yours forever."],["Vende Pokémon para ganar ₽. 3 iguales se fusionan en 1 evolución. Cada especie tiene su valor base; las estrellas (1-5) cambian su valor.","Sell Pokémon to earn ₽. 3 identical ones merge into 1 evolution. Each species has a base value; stars (1-5) change its value."],["Vende Pokémon para ganar ₽. Cada especie tiene un valor base según su rareza.","Sell Pokémon to earn ₽. Each species has a base value according to its rarity."],["Registra Pokémon por zona y consulta su valor base. Completar una zona te da su Medalla y su Amuleto Iris (shiny ×2 allí).","Register Pokémon by zone and check their base value. Completing a zone gives you its Badge and its Iris Charm (shiny ×2 there)."],["Registra todos los Pokémon de una zona para ganar su Medalla y su Amuleto Iris, que atrae la fortuna brillante allí.","Register all the Pokémon of a zone to earn its Badge and its Iris Charm, which draws shiny fortune there."],["Amuleto Iris: la fortuna brillante te sonríe en","Iris Charm: shiny fortune smiles on you in"],["A veces algo misterioso aparece entre la hierba: una bola extraña. Tócala… ¿quién habrá dentro? Necesitarás Pokéballs para atraparlo. Algunos son más grandes y especiales que el resto.","Sometimes something mysterious appears in the grass: a strange ball. Touch it… who could be inside? You'll need Poké Balls to catch it. Some are bigger and more special than the rest."],["Dicen que a veces nace uno que brilla de forma especial… Si ocurre, lo sabrás: una lluvia de estrellas lo anuncia.","They say that sometimes one is born that shines in a special way… If it happens, you'll know: a rain of stars announces it."],["Una bola que se abre a toques y guarda recompensas misteriosas","A ball that opens with taps and holds mysterious rewards"],["Aquí quedan anotados todos los objetos que has conseguido alguna vez.","Every item you've ever obtained is recorded here."],["Aquí ves solo lo que posees: huevos, Pokéballs, objetos, incubadora y medallas.","Here you see only what you own: eggs, Poké Balls, items, incubator and badges."],["Aquí ves todo lo que posees: huevos, Pokédrops, objetos, incubadora y tu estuche de medallas.","Here you see everything you own: eggs, Pokédrops, items, incubator and your badge case."],["Aquí viven tus shinies, aparte del PC.","Your shinies live here, apart from the PC."],["30 % de recuperar la bola fallida","30 % chance to recover a failed ball"],["5 % de captura crítica (radio ×3)","5 % critical capture (radius ×3)"],["gestión del PC por zona y patrimonio shiny","PC management by zone and shiny net worth"],["huevos cada vez más valiosos","increasingly valuable eggs"],["de vez en cuando, un huevo brilla con más fuerza","every now and then, an egg glows more strongly"],["el doble de encuentros en la guardería","double the encounters at the nursery"],["huevo(s) listo(s) en la Mochila","egg(s) ready in the Bag"],["Partida separada: no toca tu progreso real.","Separate game: it doesn't touch your real progress."],["Próximo huevo de Ditto en","Next Ditto egg in"],["· Ditto pone 1 cada","· Ditto lays 1 every"],["· en la guardería","· in the nursery"],["1 huevo cada 5 min ·","1 egg every 5 min ·"],["1 huevo común cada","1 common egg every"],["Registrar Pokédex","Register in Pokédex"],["¡Toca la bola!","Tap the ball!"],["más en cola","more in queue"],["(Google: hay que configurar un Client ID en el código).","(Google: a Client ID must be set in the code)."],["Te faltan","Missing"],["Montaña","Mountain"]]);

const langBtns=(f)=>LANGS.map(x=>`<button class="${CFG.lang===x[0]?"on":"w"}" onclick="setLang('${x[0]}')">${x[f]}</button>`).join("");
const _tt={};
function trTab(l){if(_tt[l])return _tt[l];const m=new Map(EN);if(l!=="en"){const L=TL[l]||[],lk=new Set(L.map(x=>x[0])),lg=L.map(x=>x[0]).filter(k=>k.length>=25);for(const k of [...m.keys()])if(!lk.has(k)&&lg.some(g=>k.includes(g)))m.delete(k);for(const[a,b]of L)m.set(a,b)}return _tt[l]=[...m].filter(x=>x[0]&&x[0]!==x[1]).sort((a,b)=>b[0].length-a[0].length)}
const trS=s=>{if(CFG.lang==="es"||!s)return s;for(const[a,b]of trTab(CFG.lang))if(s.includes(a))s=s.split(a).join(b);return s};
const _cf=window.confirm;window.confirm=s=>_cf.call(window,trS(s));
if(typeof MutationObserver!=="undefined"){const fx=n=>{const v=n.nodeValue,w=trS(v);if(w!==v)n.nodeValue=w},wk=n=>{if(n.nodeType===3)fx(n);else if(n.childNodes)n.childNodes.forEach(wk)};
  new MutationObserver(ms=>{if(CFG.lang==="es")return;for(const m of ms){if(m.type==="characterData")fx(m.target);m.addedNodes.forEach(wk)}}).observe(document.body,{childList:true,subtree:true,characterData:true})}

 el.style.display="flex";if(u&&$("#stu")){$("#stu").value=u;if(act==="stu")$("#stu").focus()}}
/* --- ficha de entrenador --- */
const medH=a=>a&&a.length?a.map(i=>`<img class="tc-m" src="${BDGI[i]}" title="${bdgName(i)}" alt="">`).join(""):`<span class="lbl">Sin medallas todavía</span>`;
const cardHtml=p=>{const ic=p.icon?`<img src="${stat(p.icon,p.ish)}">`:`<img src="${EGGI.n[0]}">`,pc=Math.round(100*p.dex/Math.max(1,p.dexTot)),sc=Math.round(100*p.dexSh/Math.max(1,p.dexTot));
 return`<div class="tc"><div class="tc-h"><div class="tc-av">${ic}</div><div class="tc-n"><b>${esc(p.name)}</b><small>Entrenador</small></div><div class="tc-lv"><small>NIVEL</small>${fmt(p.lv)}</div></div>
 <div class="tc-g"><div><small>Patrimonio shiny</small><b>₽${fmt(p.wealth)}</b><i class="tc-pos" data-r="wealth" data-v="${p.wealth}"></i></div><div><small>Experiencia</small><b>${fmt(p.xp)}</b><i class="tc-pos" data-r="xp" data-v="${p.xp}"></i></div>
 <div><small>Shinies conseguidos</small><b>${fmt(p.shinies)}</b></div><div><small>Huevos abiertos</small><b>${fmt(p.eggs)}</b></div></div>
 <div class="tc-d"><div class="dxt"><span>Pokédex <b>${p.dex}</b>/${p.dexTot}</span><span class="dxs">★ ${p.dexSh}</span></div><div class="dxbar"><i style="width:${pc}%"></i></div></div>
 <div class="tc-md">${medH(p.medals)}</div>
 <div class="tc-f"><span>Encargos ${fmt(p.qd||0)}</span><span>Expediciones ${fmt(p.xd||0)}</span><span>Trueques ${fmt(p.td||0)}</span></div></div>`};
async function fillPos(root){if(!ON||AU.st!=="in")return;for(const i of root.querySelectorAll(".tc-pos")){try{const r=await NET.rank(i.dataset.r,+i.dataset.v);i.textContent="Puesto #"+fmt(r)}catch(e){}}}
function trnTab(){const p=mkProf();
 $("#tab").innerHTML=cardHtml(p)+`<div class="box"><b>Icono de la ficha</b><p class="lbl">Elige cualquier Pokémon que hayas registrado en tu Pokédex, o deja el huevo.</p><div class="row"><button class="g" onclick="icoPick('')">Elegir Pokémon</button>${S.icon?`<button class="w" onclick="S.icon=0;S.icsh=0;save();cloudTick(true);trnTab()">Volver al huevo</button>`:""}</div></div>`+(ON?accBox():`<div class="box"><b>Cuenta</b><p class="lbl">Las cuentas online todavía no están activas en esta versión: la ficha es local. Cuando se active el servidor aparecerán aquí el nombre de usuario, los rankings y los amigos.</p></div>`);
 fillPos($("#tab"))}
function accBox(){const hp=AU.provs.includes("password"),hg=AU.provs.includes("google.com");
 return`<div class="box"><b>Cuenta · ${esc(AU.name)}</b><p class="lbl">Acceso: contraseña ${hp?"✔":"✘"} · Google ${hg?"✔":"✘"}<br>${hg?"Con Google vinculado puedes recuperar tu cuenta.":"Vincula Google: así podrás recuperar la cuenta si olvidas la contraseña."}</p>
 <div class="row">${hg?"":`<button class="g" onclick="accGoogle()">Vincular Google</button>`}<button class="w" onclick="pwForm(${hp?1:0})">${hp?"Cambiar":"Crear"} contraseña</button><button class="w" onclick="cloudTick(true).then(()=>toast('Progreso sincronizado'))">Sincronizar ahora</button></div>
 <div class="row"><button class="w" onclick="doLogout()">Cerrar sesión</button><button class="r" onclick="delForm()">Eliminar cuenta</button></div></div>`}
async function accGoogle(){try{await NET.linkGoogle();AU.provs=NET.provs();toast("Google vinculado");trnTab()}catch(e){const m=emsg(e);if(m)toast(m)}}
function pwForm(ch){showModal(`<div style="font-size:11px;margin-bottom:8px">${ch?"CAMBIAR":"CREAR"} CONTRASEÑA</div><form onsubmit="return pwGo(event,${ch})">${ch?`<label class="fl">Contraseña actual<input id="pw0" type="password" autocomplete="current-password"></label>`:""}<label class="fl">Nueva contraseña (mín. 8)<input id="pw1" type="password" autocomplete="new-password"></label><label class="fl">Repítela<input id="pw2" type="password" autocomplete="new-password"></label><p class="lbl" id="pwe"></p><button class="g">Guardar</button></form>`)}
async function pwGo(ev,ch){ev.preventDefault();const a=$("#pw1").value,e=$("#pwe");if(a.length<8){e.textContent="Mínimo 8 caracteres";return false}if(a!==$("#pw2").value){e.textContent="No coinciden";return false}
 try{if(ch)await NET.chPass(AU.name.toLowerCase(),$("#pw0").value,a);else await NET.linkPass(AU.name.toLowerCase(),a);AU.provs=NET.provs();closeModal();toast("Contraseña guardada");trnTab()}catch(x){e.textContent=emsg(x)}return false}
function delForm(){showModal(`<div style="font-size:11px;margin-bottom:8px">ELIMINAR CUENTA</div><p>Se borrarán tu ficha, tu nombre, tu lista de amigos y tu partida guardada en la nube. No se puede deshacer.</p><p class="lbl">Escribe <b>ELIMINAR</b> para confirmar:</p><input id="dlc" autocomplete="off"><div class="row"><button class="r" onclick="delGo()">Eliminar definitivamente</button></div>`)}
async function delGo(){if($("#dlc").value.trim()!=="ELIMINAR")return toast("Escribe ELIMINAR para confirmar");try{await NET.wipe(AU.name.toLowerCase());CFG.ok=0;try{localStorage.removeItem(SK)}catch(e){}location.reload()}catch(e){toast(emsg(e))}}
function icoPick(q){q=(q||"").toLowerCase();const l=D.sp.filter(m=>S.seen[m.id]>0&&m.n.toLowerCase().includes(q)).sort((a,b)=>a.id-b.id),t=l.slice(0,150);
 const h=`<div style="font-size:11px;margin-bottom:8px">ICONO DE LA FICHA</div><input id="icq" placeholder="Buscar en tu Pokédex…" value="${esc(q)}" oninput="icoRe(this.value)" autocomplete="off"><div class="ic-g" id="icg">${icoGrid(t)}</div>${l.length>150?`<p class="lbl">Mostrando 150 de ${l.length}: escribe para filtrar.</p>`:""}${l.length?"":`<p class="lbl">No hay coincidencias.</p>`}`;
 showModal(h);const i=$("#icq");if(i){i.focus();i.setSelectionRange(q.length,q.length)}}
const icoGrid=t=>t.map(m=>`<button class="ic-t" title="${m.n}" onclick="icoSet(${m.id},0)"><img src="${stat(m.id)}"></button>${S.shiny[m.id]>0?`<button class="ic-t sh" title="${m.n} ★" onclick="icoSet(${m.id},1)"><img src="${stat(m.id,1)}"></button>`:""}`).join("");
function icoRe(v){const q=v.toLowerCase(),l=D.sp.filter(m=>S.seen[m.id]>0&&m.n.toLowerCase().includes(q)).sort((a,b)=>a.id-b.id);$("#icg").innerHTML=icoGrid(l.slice(0,150))}
function icoSet(id,s){S.icon=id;S.icsh=s;save();closeModal();cloudTick(true);if(tab==="trn")trnTab()}
/* --- rankings y amigos --- */
let rkM="wealth",rkC={};
function rankTab(){
 $("#tab").innerHTML=`<div class="box"><div class="rk-s"><button class="${rkM==="wealth"?"on":"w"}" onclick="rkM='wealth';rankTab()">Patrimonio shiny</button><button class="${rkM==="xp"?"on":"w"}" onclick="rkM='xp';rankTab()">Nivel</button><button class="${rkM==="fr"?"on":"w"}" onclick="rkM='fr';rankTab()">Amigos (${FR.size})</button></div>
 <div class="row"><input id="rkq" placeholder="Buscar entrenador por nombre…" maxlength="16" autocomplete="off" onkeydown="if(event.key==='Enter')rkSearch()" style="flex:1;min-width:140px"><button onclick="rkSearch()">Buscar</button></div></div><div id="rkl" class="box"><p class="lbl">Cargando…</p></div>`;rkLoad()}
const rkRow=(p,i,m)=>`<div class="rk-r${AU.u&&p.uid===AU.u.uid?" me":""}${i<=3?" t"+i:""}" onclick="viewCard('${p.uid}')"><span class="rk-n">${i}</span><div class="tc-av s">${p.icon?`<img src="${stat(p.icon,p.ish)}">`:`<img src="${EGGI.n[0]}">`}</div><b>${esc(p.name)}${FR.has(p.uid)?' <em>amigo</em>':""}</b><span class="rk-v">${m==="xp"?"Nv "+fmt(p.lv):"₽"+fmt(p.wealth)}</span></div>`;
async function rkLoad(){const box=$("#rkl"),m=rkM;try{await cloudTick();
  if(m==="fr"){const ids=[...FR],ps=(await Promise.all(ids.map(id=>NET.prof(id).catch(()=>null)))).filter(Boolean),me=mkProf();ps.push({uid:AU.u.uid,...me});ps.sort((a,b)=>b.wealth-a.wealth);
   if(rkM!==m)return;box.innerHTML=`<b>Tus amigos</b><p class="lbl">Busca entrenadores por su nombre para añadirlos. Toca uno para ver su ficha.</p>`+(ps.length>1?ps.map((p,i)=>rkRow(p,i+1,"wealth")).join(""):`<p class="lbl">Aún no tienes amigos añadidos.</p>`);return}
  let c=rkC[m];if(!c||Date.now()-c.t>60000){c={t:Date.now(),a:await NET.top(m)};rkC[m]=c}
  if(rkM!==m)return;const me=mkProf(),inTop=c.a.some(p=>p.uid===AU.u.uid);let pos="";try{pos=await NET.rank(m,m==="xp"?me.xp:me.wealth)}catch(e){}
  box.innerHTML=`<b>${m==="xp"?"Ranking de nivel":"Ranking de patrimonio shiny"}</b><p class="lbl">Tu puesto: <b>#${fmt(pos||0)}</b> · se actualiza cada pocos minutos</p>`+c.a.map((p,i)=>rkRow(p,i+1,m)).join("")+(inTop?"":`<div class="rk-gap">···</div>${rkRow({uid:AU.u.uid,...me},pos||"-",m)}`)
 }catch(e){box.innerHTML=`<p class="lbl">No se pudo cargar el ranking (${emsg(e)}).</p>`}}
async function rkSearch(){const q=$("#rkq").value.trim().toLowerCase(),box=$("#rkl");if(!/^[a-z0-9_]{1,16}$/.test(q))return toast("Escribe parte del nombre (letras, números o _)");box.innerHTML=`<p class="lbl">Buscando…</p>`;
 try{const r=await NET.find(q);box.innerHTML=`<b>Resultados para «${esc(q)}»</b>`+(r.length?r.map((p,i)=>rkRow(p,"·",rkM==="xp"?"xp":"wealth")).join(""):`<p class="lbl">Nadie se llama así.</p>`)+`<div class="row"><button class="w" onclick="rankTab()">Volver al ranking</button></div>`}catch(e){box.innerHTML=`<p class="lbl">Error en la búsqueda (${emsg(e)})</p>`}}
async function viewCard(uid){try{const p=await NET.prof(uid);if(!p)return toast("Ese entrenador ya no existe");const me=AU.u&&uid===AU.u.uid,fr=FR.has(uid);
 showModal(cardHtml(p)+(me?"":`<div class="row" style="justify-content:center"><button class="${fr?"r":"g"}" onclick="frToggle('${uid}')">${fr?"Quitar de amigos":"Añadir amigo"}</button></div>`));fillPos($("#dm"))}catch(e){toast(emsg(e))}}
async function frToggle(uid){try{if(FR.has(uid)){await NET.delF(uid);FR.delete(uid);toast("Amigo eliminado")}else{if(FR.size>=100)return toast("Máximo 100 amigos");await NET.addF(uid);FR.add(uid);toast("Amigo añadido")}closeModal();if(tab==="rank")rankTab()}catch(e){toast(emsg(e))}}

function startGame(){if(ON&&AU.st!=="in")return;const el=$("#start");el.style.display="none";el.innerHTML="";music();go(tab);if(S.dcur)dropOpen()}
function newGame(){if(!confirm("¿Empezar una partida nueva? Se borrará el progreso guardado."))return;S=def();S.lv=1;if(AU.u)S.acc=AU.u.uid;save();if(ON)cloudTick(true);startGame();go("egg")}
/* ---------- globales ---------- */
document.addEventListener("load",e=>{const t=e.target;if(t.dataset&&t.dataset.id!==undefined)t.style.width=t.naturalWidth*(t.dataset.f?(t.closest("#fx")?3.4:1):t.dataset.b?3.2:t.closest("#dm")?3:t.closest("#stage")?2.6:t.closest("#fx")?5:1.5)+"px"},true);
document.addEventListener("error",e=>{const t=e.target;if(!t||t.tagName!=="IMG")return;const s=t.getAttribute("src")||"";
  if(s.startsWith(LS+"items/")&&!t.dataset.r){t.dataset.r=1;t.src=SP+s.slice(LS.length);return}
  if(s.startsWith(LS)&&!t.dataset.r){t.dataset.r=1;t.src=BW+s.slice(LS.length);return}
  if(t.dataset&&t.dataset.id&&!t.dataset.f){t.dataset.f=1;t.src=SP+"pokemon/"+(t.dataset.s?"shiny/":"")+t.dataset.id+".png"}
  else if(t.dataset&&t.dataset.h!==undefined){if(!t.dataset.g){t.dataset.g=1;t.src=ICO.gem}else t.style.visibility="hidden"}},true);
setInterval(()=>{if(S.lv>=20&&!S.dzann&&$("#start").style.display!=="flex"){S.dzann=1;ANQ.push({k:"dzhint"});save()}incTick();ceTick();cetUi();hud();if(!busy&&!annRun&&ANQ.length)runAnn();
  if(on("cha")&&!busy&&tab==="egg"&&$("#egg")&&S.box.length<S.cap&&!S.exp&&false)openEgg()},1000);
setInterval(()=>{const f=$("#fx"),m=$("#fm");if(!f||!m||!f.classList.contains("on")||!m.complete||!m.naturalWidth||m.dataset.id===undefined||!(m.src.includes("/animated/")||m.dataset.f))return;const w=m.naturalWidth*(m.dataset.f?3.4:5)*(m.dataset.al==="1"?1.35:1);if(Math.abs((parseFloat(m.style.width)||0)-w)>1)m.style.width=w+"px"},120);
setInterval(save,30000);document.addEventListener("visibilitychange",()=>{if(document.hidden){save();gUp()}});
S.zu=[...new Set(S.zu)];S.lv=lvl();chkWorlds();
if(TESTM){$("h1").insertAdjacentHTML("beforeend",'<small style="font-size:10px;color:#ffd23f;margin-left:6px">PRUEBA</small>');if(!hasSave())testAll()}
go(S.exp?"expe":"egg");document.documentElement.lang=CFG.lang;showStart();netBoot();
</script></body></html>
